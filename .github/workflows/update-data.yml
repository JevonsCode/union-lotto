permissions:
  contents: write
name: 🤗 Update Lottery Data

on:
  schedule:
    # 每天集数据更新数据
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动启动
  push:
    branches: [ master, main ]
    paths:
      - 'data/get-numbers.js'
      - 'package.json'

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 🦌 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 git 历史

      - name: 🍎 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🥳 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🎬 Install dependencies
        run: pnpm install

      - name: 🐝 Update lottery data
        run: pnpm crawl

      - name: 🎱 Copy data to public directory
        run: |
          mkdir -p public/data
          cp data/lotto-data.json public/data/lotto-data.json

      - name: 🔍 Check data changes
        run: |
          echo "检查数据文件变化..."
          if git diff --quiet data/lotto-data.json; then
            echo "数据没有变化"
          else
            echo "数据有更新"
            git diff --stat data/lotto-data.json
          fi

      - name: 🍍 Commit and push changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/lotto-data.json public/data/lotto-data.json
          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
          else
            git commit -m "🧺 Auto update lottery data"
            git pull --rebase
            git push
          fi

      - name: 📪 Create summary
        run: |
          echo "## 👍 数据更新内容" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**更新时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**数据文件**: data/lotto-data.json" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/lotto-data.json" ]; then
            echo "**数据条数**: $(jq length data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
            echo "**最新解析**: $(jq -r '.[0].issue' data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
            echo "**最新彩彩日期**: $(jq -r '.[0].openTime' data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
          fi
