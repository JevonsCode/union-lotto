permissions:
  actions: write
  contents: write

name: \ud83c\udf15 Update Lottery Data

on:
  schedule:
    # GitHub Actions 使用 UTC：14:00 UTC = 北京时间 22:00
    - cron: '0 14 * * *'
  workflow_dispatch: # 允许手动启动
  push:
    branches: [ master, main ]
    paths:
      - 'data/get-numbers.js'
      - 'package.json'

concurrency:
  group: update-lottery-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: \ud83d\uddc3\ufe0f Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 git 历史

      - name: \ud83e\uddf3 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: \ud83e\ude91 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: \ud83c\udf6b Install dependencies
        run: pnpm install

      - name: \ud83c\udf90 Update lottery data
        shell: bash
        run: |
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            echo "第 $attempt/$max_attempts 次抓取数据..."
            if pnpm crawl; then
              echo "数据抓取成功"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::数据抓取失败，已重试 $max_attempts 次"
              exit 1
            fi

            wait_seconds=$((attempt * 30))
            echo "请求失败，$wait_seconds 秒后重试..."
            sleep "$wait_seconds"
          done

      - name: \ud83d\udeec Copy data to public directory
        run: |
          mkdir -p public/data
          cp data/lotto-data.json public/data/lotto-data.json

      - name: \ud83d\udd0d Check data changes
        id: data_changes
        shell: bash
        run: |
          echo "检查数据文件变化..."
          if git diff --quiet -- data/lotto-data.json public/data/lotto-data.json; then
            echo "数据没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "数据有更新"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/lotto-data.json public/data/lotto-data.json
          fi

      - name: \ud83c\udf40 Commit and push changes
        id: commit_changes
        if: steps.data_changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/lotto-data.json public/data/lotto-data.json
          git commit -m "\ud83c\udf90 Auto update lottery data"
          git pull --rebase

          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ "$local_sha" = "$remote_sha" ]; then
            echo "相同数据已由另一个运行推送，无需再次推送"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
            pushed_sha=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
            if [ "$pushed_sha" != "$local_sha" ]; then
              echo "::error::远端分支未更新到预期提交 ${local_sha}"
              exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: \ud83d\udd0e Check Pages deployment
        id: deployment_status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          if [ -z "$target_sha" ]; then
            echo "::error::无法解析远端分支 ${GITHUB_REF_NAME}"
            exit 1
          fi

          healthy_runs=$(gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
            -f "head_sha=${target_sha}" \
            -f "branch=${GITHUB_REF_NAME}" \
            -f per_page=20 \
            --jq '[.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch") and (.status != "completed" or .conclusion == "success"))] | length')

          if [ "$healthy_runs" -gt 0 ]; then
            echo "提交 ${target_sha} 已有成功或进行中的 Pages 部署"
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "提交 ${target_sha} 尚无有效 Pages 部署"
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: \ud83d\ude80 Deploy updated data
        if: steps.deployment_status.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -f "ref=${GITHUB_REF_NAME}"

      - name: \ud83c\udf4d Create summary
        run: |
          echo "## 数据更新内容" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**更新时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**数据文件**: data/lotto-data.json" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/lotto-data.json" ]; then
            echo "**数据条数**: $(jq length data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
            echo "**最新解析**: $(jq -r '.[0].issue' data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
            echo "**最新彩彩日期**: $(jq -r '.[0].openTime' data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
          fi
