permissions:
  contents: write
name: \ud83c\udf15 Update Lottery Data

on:
  schedule:
    # \u6bcf\u5468\u4e8c\u56db\u65e5\u665a\u4e0a9\u70b9\u534a (Asia/Singapore\uff0cUTC+8\uff0c21:30)\uff0c\u5bf9\u5e94\u5173\u8c03\u4e3b\u673a\u65f6\u533a\u65f6\u95f4 13:30 UTC
    - cron: '30 13 * * 2,4,7'
  workflow_dispatch: # 允许手动启动
  push:
    branches: [ master, main ]
    paths:
      - 'data/get-numbers.js'
      - 'package.json'

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: \ud83d\uddc3\ufe0f Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 git 历史

      - name: \ud83e\uddf3 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: \ud83e\ude91 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: \ud83c\udf6b Install dependencies
        run: pnpm install

      - name: \ud83c\udf90 Update lottery data
        run: pnpm crawl

      - name: \ud83d\udeec Copy data to public directory
        run: |
          mkdir -p public/data
          cp data/lotto-data.json public/data/lotto-data.json

      - name: \ud83d\udd0d Check data changes
        run: |
          echo "检查数据文件变化..."
          if git diff --quiet data/lotto-data.json; then
            echo "数据没有变化"
          else
            echo "数据有更新"
            git diff --stat data/lotto-data.json
          fi

      - name: \ud83c\udf40 Commit and push changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/lotto-data.json public/data/lotto-data.json
          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
          else
            git commit -m "\ud83c\udf90 Auto update lottery data"
            git pull --rebase
            git push
          fi

      - name: \ud83c\udf4d Create summary
        run: |
          echo "##  数据更新内容" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**更新时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**数据文件**: data/lotto-data.json" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/lotto-data.json" ]; then
            echo "**数据条数**: $(jq length data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
            echo "**最新解析**: $(jq -r '.[0].issue' data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
            echo "**最新彩彩日期**: $(jq -r '.[0].openTime' data/lotto-data.json)" >> $GITHUB_STEP_SUMMARY
          fi
